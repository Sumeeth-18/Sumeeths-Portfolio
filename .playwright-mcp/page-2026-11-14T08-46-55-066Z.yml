          - generic [ref=f72e99]:
            - paragraph [ref=f72e100]: I don't start with a tool. I start with the problem.
            - paragraph [ref=f72e101]: The one who keeps the diary above — web designer, application developer and graphic designer, depending on what the problem asks for.
          - generic [ref=f72e102]:
            - paragraph [ref=f72e103]: "Someone usually arrives with a need, not a specification: customers who can't find a product, a gym that wants members to track their progress, a business that has to be seen. Before I open an editor, I want to know what is actually in the way."
            - paragraph [ref=f72e104]: Only then do I decide what to make. Sometimes the answer is a website. Sometimes it is an application. Sometimes it is a visual design, such as a thumbnail, a poster or a logo. Often it is a combination, and the pieces have to look like they belong together.
