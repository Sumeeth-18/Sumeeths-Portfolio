        - generic [ref=f12e99]:
          - generic [ref=f12e100]:
            - paragraph [ref=f12e101]: I don't start with a tool. I start with the problem.
            - paragraph [ref=f12e102]: The one who keeps the diary above — web designer, application developer and graphic designer, depending on what the problem asks for.
          - generic [ref=f12e103]:
            - paragraph [ref=f12e104]: "Someone usually arrives with a need, not a specification: customers who can't find a product, a gym that wants members to track their progress, a business that has to be seen. Before I open an editor, I want to know what is actually in the way."
            - paragraph [ref=f12e105]: Only then do I decide what to make. Sometimes the answer is a website. Sometimes it is an application. Sometimes it is a visual design, such as a thumbnail, a poster or a logo. Often it is a combination, and the pieces have to look like they belong together.
            - list [ref=f12e106]:
              - listitem [ref=f12e107]:
                - generic [ref=f12e108]: Understand
                - generic [ref=f12e109]: What is the problem, who has it, and what does solving it look like?
              - listitem [ref=f12e110]:
                - generic [ref=f12e111]: Choose
                - generic [ref=f12e112]: Pick the digital solution that fits, instead of the one I happen to prefer.
              - listitem [ref=f12e113]:
                - generic [ref=f12e114]: Build
                - generic [ref=f12e115]: Design and develop it, check it on real screens, and put it online.
