    - region [ref=f52e93]:
      - generic [ref=f52e94]:
        - 'img "Illustrated portrait of Sumeeth: a young man in sunglasses and a dark hoodie" [ref=f52e96]'
        - paragraph [ref=f52e97]: Heyy...!! I am Sumeeth
        - generic [ref=f52e98]:
          - generic [ref=f52e99]:
            - paragraph [ref=f52e100]: I don't start with a tool. I start with the problem.
            - paragraph [ref=f52e101]: The one who keeps the diary above — web designer, application developer and graphic designer, depending on what the problem asks for.
          - generic [ref=f52e102]:
            - paragraph [ref=f52e103]: "Someone usually arrives with a need, not a specification: customers who can't find a product, a gym that wants members to track their progress, a business that has to be seen. Before I open an editor, I want to know what is actually in the way."
            - paragraph [ref=f52e104]: Only then do I decide what to make. Sometimes the answer is a website. Sometimes it is an application. Sometimes it is a visual design, such as a thumbnail, a poster or a logo. Often it is a combination, and the pieces have to look like they belong together.
            - list [ref=f52e105]:
              - listitem [ref=f52e106]:
                - generic [ref=f52e107]: Understand
                - generic [ref=f52e108]: What is the problem, who has it, and what does solving it look like?
              - listitem [ref=f52e109]:
                - generic [ref=f52e110]: Choose
                - generic [ref=f52e111]: Pick the digital solution that fits, instead of the one I happen to prefer.
              - listitem [ref=f52e112]:
                - generic [ref=f52e113]: Build
                - generic [ref=f52e114]: Design and develop it, check it on real screens, and put it online.
